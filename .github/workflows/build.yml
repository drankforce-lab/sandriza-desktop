# =============================================================================
# CONSTRUCTION DE L'APPLICATION DE BUREAU — dépôt PUBLIC
# -----------------------------------------------------------------------------
# ⚠ CE WORKFLOW NE PUBLIE RIEN. Il construit, et dépose les paquets en
# ARTÉFACTS de l'exécution. La publication dans Cloudflare R2 se fait depuis le
# dépôt PRIVÉ (workflow « Publier l'application de bureau »), qui seul détient
# les identifiants R2.
#
# ── POURQUOI CETTE SÉPARATION ────────────────────────────────────────────────
# Les minutes GitHub Actions sont GRATUITES et illimitées sur un dépôt public,
# alors qu'un dépôt privé les décompte — et les minutes macOS y comptent ×10.
# Construire ici ne coûte rien.
# Mais le bucket R2 ne contient pas que des installateurs : il porte aussi les
# SAUVEGARDES, les PHOTOS PRODUIT et les EXPORTS COMPTABLES. Ses identifiants
# n'ont donc rien à faire dans un dépôt public, quelles que soient les
# protections de GitHub sur les secrets. Ils restent du côté privé.
#
# ── CE QUI EST PUBLIC ICI, ET CE QUI NE L'EST PAS ────────────────────────────
# Public : le code de la COQUILLE — une fenêtre Electron qui ouvre
#          adm.sandriza.com, imprime, et gère ses mises à jour. Aucune donnée
#          d'affaires, aucun code de la boutique, aucun accès à la base.
# Secret : `ELG_APP_KEY`, la clé du verrou d'application, écrite dans
#          `src/cle.js` À LA CONSTRUCTION et jamais commitée.
#
# ⚠ LES SECRETS NE SONT PAS EXPOSÉS AUX FORKS. GitHub ne les fournit pas aux
# exécutions déclenchées par une pull request venant d'un fork, et
# `workflow_dispatch` exige un droit d'écriture sur le dépôt. C'est pour ça que
# ce workflow n'a QUE ce déclencheur : pas de `push`, pas de `pull_request`.
# =============================================================================
name: Construire

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (doit correspondre à package.json)"
        required: true
      avec_mac:
        description: "Construire aussi les paquets macOS ? (inutile tant qu'aucun Mac n'est en service — et la mise à jour automatique y est impossible sans signature Apple)"
        type: boolean
        required: true
        default: false

# Aucun droit n'est nécessaire : on ne touche ni au dépôt, ni aux releases.
permissions:
  contents: read
  actions: write        # pour purger les artefacts des constructions precedentes

jobs:
  # ══ LE MENAGE PASSE AVANT, ET C'EST OBLIGATOIRE ══════════════════════════
  # Signale le 2026-09-04 par une alerte GitHub : << You have used 100% of the
  # Actions storage >>. Le quota est de 0,5 Go ; une construction depose trois
  # installateurs Windows, soit ~240 Mo. DEUX constructions suffisent donc a le
  # remplir, et il y en avait eu sept dans la journee — 1 582 Mo, trois fois le
  # quota, facturable.
  #
  # ⚠ `retention-days: 1` NE SUFFIT PAS, et c'est le piege : il etait deja pose.
  # La retention se compte en JOURS, alors que le depassement se produit en
  # QUELQUES HEURES. Un delai n'a jamais borne un debit.
  #
  # ⚠ POURQUOI ICI ET PAS APRES LA PUBLICATION : le jeton du depot du site
  # (`GH_DESKTOP_TOKEN`) est volontairement en LECTURE SEULE sur les Actions de
  # ce depot-ci — il peut telecharger les paquets, pas les effacer. Le seul
  # jeton qui a le droit de supprimer est celui de ce depot, donc le menage se
  # fait ici, AVANT de deposer les nouveaux paquets. Le stockage ne peut alors
  # plus depasser une construction.
  #
  # ⚠ CE QUE CELA IMPOSE : PUBLIER AVANT DE RECONSTRUIRE. Les paquets d'une
  # construction non publiee disparaissent au lancement de la suivante. Ce n'est
  # pas une perte — une version publiee vit dans R2, pas ici — mais l'ordre
  # build -> publish -> build est desormais la seule marche a suivre.
  menage:
    runs-on: ubuntu-latest
    steps:
      - name: Purger les artefacts des constructions precedentes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          total=0
          n=0
          for page in 1 2 3; do
            ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$page"                     --jq '.artifacts[] | select(.expired==false) | "\(.id) \(.size_in_bytes)"' || true)
            [ -z "$ids" ] && break
            while read -r id taille; do
              [ -z "$id" ] && continue
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || continue
              total=$((total + taille)); n=$((n + 1))
            done <<< "$ids"
          done
          echo "::notice::$n artefact(s) purge(s), $((total / 1048576)) Mo liberes avant construction."

  # ══ LES CONTRASTES, MESURES DANS UN VRAI NAVIGATEUR ══════════════════════
  # ⚠ POURQUOI UN TRAVAIL A PART, ET PAS DANS << Controle de syntaxe >>.
  # Ce dernier tourne sur la MATRICE des trois architectures Windows : y mettre
  # un banc de deux a quatre minutes le ferait tourner TROIS FOIS, sur trois
  # machines, pour un resultat identique — les couleurs d'une page ne dependent
  # pas du processeur qui la construit. Une seule machine Linux suffit, et elle
  # tourne EN MEME TEMPS que les constructions.
  #
  # ⚠ IL NE BLOQUE PAS LA CONSTRUCTION (`needs` ne le nomme pas). Une version
  # doit pouvoir partir meme si un contraste a glisse : refuser de construire
  # pour une couleur, c'est se retrouver a le desactiver le jour ou ca presse.
  # Le travail est ROUGE et se voit dans le recapitulatif — c'est ce qu'on veut.
  #
  # ⚠ Chrome est deja installe sur `ubuntu-latest`. S'il venait a disparaitre,
  # le banc REFUSE (il ne se tait pas) : << Chrome introuvable >>, et le travail
  # est rouge. Un banc qui saute faute d'outil doit le dire.
  contrastes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contrastes des fenetres, mesures au rendu
        run: node tools/banc-contraste-rendu.js

  windows:
    needs: menage
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── La clé du verrou, injectée ICI et nulle part ailleurs ──────────────
      # ⚠ On ÉCHOUE si le secret est absent. Sans lui, l'application se
      # construirait très bien — et serait refusée (403) par le serveur sur
      # chaque poste. Mieux vaut ne rien livrer qu'un paquet mort-né.
      - name: Injecter la clé d'application
        shell: bash
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent. L'application construite serait refusée par le serveur."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js

      # ⚠⚠ ET LE PALIER : LA MINEURE NE DÉPASSE PAS 75. Règle posée le 2026-08-09
      # — arrivé à `x.75.0`, la suivante est `(x+1).0.0`, jamais `x.76.0`. Sans
      # palier, la mineure grossit indéfiniment et le numéro ne dit plus rien de
      # l'ampleur du travail.
      # Elle était notée, indexée, et elle a été enfreinte DEUX FOIS quand même :
      # `2.76.0`, puis `3.76.0` (corrigée en 4.0.0). Une règle qu'on répète et
      # qu'on oublie n'est pas une règle, c'est un vœu — donc c'est un contrôle,
      # et il vit ICI parce que c'est la construction qui transforme un numéro en
      # version installée chez quelqu'un. Le pendant côté site est l'étape 1k de
      # `tools/check/verifier.ps1`, qui lit les clés de NOTES dans `pont.js`.
      - name: Vérifier la version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::package.json annonce $PKG, la demande porte sur ${{ inputs.version }}."
            exit 1
          fi
          MAJ=${PKG%%.*}
          RESTE=${PKG#*.}
          MIN=${RESTE%%.*}
          if [ "$MIN" -gt 75 ]; then
            echo "::error::Palier de version enfreint : $PKG a une mineure de $MIN. Arrivé à $MAJ.75.0, la suivante est $((MAJ+1)).0.0 — jamais $MAJ.76.0."
            exit 1
          fi
          if [ "$MIN" -eq 75 ]; then
            echo "::warning::$PKG atteint le plafond : la PROCHAINE version doit être $((MAJ+1)).0.0."
          fi

      - name: Dépendances
        shell: bash
        # ⚠ Le binaire Electron se télécharge (install.js) depuis la CDN des
        # « releases » de GitHub, régulièrement en panne TRANSITOIRE : EOF, 503,
        # socket hang up — TROIS échecs d'affilée le 2026-08-12, pur réseau, pas
        # le code. On réessaie depuis LA MÊME source officielle (github.com/
        # electron), aucun miroir tiers — le binaire reste celui d'Electron —,
        # avec un délai croissant. `npm ci` repart d'un node_modules propre.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npm ci || npm install; then echo "Dépendances OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Dépendances : échec réseau (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Dépendances : 5 tentatives échouées (CDN Electron indisponible ?)"; exit 1; fi

      # Un simple contrôle de syntaxe : une faute de frappe ici coûte une
      # construction complète et une réinstallation sur chaque poste.
      # ⚠ `src/*.js` NE COUVRAIT PAS `src/fenetres/`, où vit tout le contenu des
      # fenêtres natives — c'est-à-dire l'essentiel de ce qui change d'une version
      # à l'autre. Et `node --check` n'y aurait de toute façon pas suffi : le
      # script de chaque fenêtre vit dans un littéral de gabarit, donc pour Node
      # c'est une CHAÎNE, et une faute dedans passe inaperçue. La fenêtre s'ouvre,
      # reste sur « Chargement… », et rien n'explique pourquoi.
      # `verifier-fenetres.js` compile le script PRODUIT, refuse l'accent grave
      # égaré dans un commentaire (arrivé quatre fois) et vérifie les ancres du
      # socle. C'est le contrôle qui a de la valeur ici, pas le plus rapide.
      # ⚠ ET COMPILER NE SUFFISAIT PAS NON PLUS. La fenêtre Imprimantes est restée
      # morte QUATRE VERSIONS avec un script qui compilait parfaitement : la faute
      # était une variable libre, licite à la compilation, fatale à l'exécution.
      # `verifier-fenetres.js` EXÉCUTE donc maintenant chaque fenêtre sur des
      # données d'essai. Et `banc-executer-page.js` éprouve L'OUTIL lui-même en y
      # injectant des défauts connus — parce que ce même outil a été construit deux
      # fois de travers, et qu'il annonçait alors « aucune faute » sur du code qui
      # levait vraiment. Il passe d'abord : un contrôle aveugle vaut moins que rien,
      # il rassure.
      # ⚠ ET AUCUN DE CES CONTRÔLES NE REGARDE CE QUE LA FENÊTRE DONNE À VOIR.
      # `executer-page.js` le dit lui-même : « ce n'est pas un navigateur [...] ce
      # contrôle ne dit donc pas la fenêtre est belle ». Il prouve qu'elle ne meurt
      # pas en silence. `verifier-mise-en-page.js` (2026-08-21) ajoute les trois
      # défauts de mise en page qui ne lèvent RIEN : une étiquette dont le for=
      # pointe vers un identifiant inexistant (le clic ne fait rien, et le lecteur
      # d'écran annonce un champ sans nom), une zone de texte où PERSONNE n'a choisi
      # de hauteur (le navigateur en met deux lignes), et une fenêtre
      # redimensionnable sans minHeight (ses boutons du bas sortent de l'écran).
      # ⚠ Il ne MESURE rien — il lit le texte. Il attrape ce qui est décidable sans
      # dessiner, et se TAIT dès qu'une valeur est calculée ou qu'un rows= est écrit
      # à la main : un rows= explicite est une décision, pas un oubli.
      # ⚠ `banc-dossier-exports.js` (2026-08-22) garde une règle qu'aucun des
      # contrôles ci-dessus ne peut voir : quand le dossier des exports choisi ne
      # répond plus (clé retirée, lecteur réseau tombé), l'export doit RÉUSSIR
      # quand même, le repli doit être ANNONCÉ, et le choix doit être GARDÉ. Rien
      # là-dedans ne lève d'erreur si c'est faux — l'export réussirait en silence
      # au mauvais endroit. La règle a été SORTIE de `main.js` pour ça : `main.js`
      # exige le processus principal d'Electron, donc un banc ne peut que le
      # recopier, et une copie ne garde rien.
      # ⚠ `banc-brouillon-garde.js` (2026-08-22) garde le même genre de règle,
      # et elle a DEUX façons de mal tourner dont la seconde est pire que la
      # première : trop permissive, la fenêtre part avec la saisie ; trop
      # stricte, l'application ne se ferme PLUS et l'on finit par la tuer depuis
      # le gestionnaire des tâches — le geste le plus destructeur de tous. Elle
      # est sortie de `main.js` pour la même raison que le dossier des exports.
      # ⚠ `banc-contraste-jour.js` (2026-09-04) garde la LISIBILITÉ DU MODE JOUR,
      # et c'est le dernier angle mort de cette liste : aucun contrôle ci-dessus ne
      # regarde une couleur. Le dépôt du site a bien un banc de contraste, mais il
      # vit là-bas et ne voit pas les fenêtres natives. C'est ainsi qu'une dette de
      # 2 300 déclarations s'est accumulée — des couleurs de mode SOMBRE posées sur
      # le fond CLAIR du mode jour, #8fa1b8 sur 828 endroits à 2.36 de ratio, et pas
      # un seul rouge pour le dire. Il a fallu deux captures d'écran de
      # l'utilisateur : « en mode jour regarde ce n'est pas beau ».
      # ⚠ C'est un CLIQUET, pas une porte fermée : la queue restante est déclarée
      # avec son nombre dans `contraste-jour-declare.js`, et le banc refuse une
      # couleur neuve sous le seuil ou un plafond qui monte.
      # ⚠ `banc-accent-grave-socle.js` (2026-09-04) refuse un accent grave a
      # l'interieur d'un gabarit de socle.js. Trois fois dans la meme journee, un
      # nom de code entre accents graves dans un commentaire CSS a referme le
      # gabarit et fait tomber les 92 fenetres. `node --check` repond OK dessus :
      # un gabarit referme trop tot reste syntaxiquement valide. Ce banc nomme la
      # ligne en deux dixiemes de seconde.
      # ⚠ `banc-texte-sur-fond.js` (2026-09-04) mesure le texte contre le fond de
      # SON PROPRE ELEMENT, pas contre celui de la page. C'est ce qui manquait :
      # un vert clair sur une pastille vert pale donne 1.02 de ratio, invisible,
      # alors que le meme vert sur le creme de la page passe le seuil. 40 regles
      # etaient en defaut, dont 25 sous 1.5. La cause de fond : les jetons de la
      # charte (--sz-accent et les six themes) n'avaient aucune valeur de jour.
      # ⚠ `banc-fonds-jour.js` (2026-09-04) est la moitié manquante du banc de
      # contraste, qui ne regarde QUE le texte et le dit dans son en-tête. Onze
      # vraies surfaces — fil des étapes des fiches, corps de facture, bande de
      # lot, panneau de l'assistant photos — restaient noires quand la fenêtre
      # passait en clair. Un fond sombre doit avoir sa reprise `html.jour`, ou
      # être déclaré comme accent plein dont la couleur porte un sens.
      # ⚠ `banc-jetons.js` (2026-09-04) garde les JETONS DE COULEUR. Il a fallu
      # trois corrections ratées et un navigateur pour trouver la cause du
      # bandeau d'en-tête invisible en mode sombre : le bloc `:root` des jetons
      # de NUIT vivait dans `CSS_SOCLE`, que 4 fenêtres sur 92 incluent. Les 88
      # autres n'avaient AUCUN jeton en sombre — chaque `var()` y était une
      # valeur invalide. `color-scheme:dark` donnait quand même un fond sombre,
      # ce qui a masqué le défaut pendant des jours. Ce banc FABRIQUE chaque
      # fenêtre et exige que tout `var()` employé soit défini par sa page.
      # ⚠ `banc-pictogrammes.js` (2026-09-04) garde la norme du NOIR ET BLANC,
      # posée le 2026-08-19 et que rien ne vérifiait. Deux défauts en sont sortis,
      # tous deux signalés par l'utilisateur plutôt que par une machine : la règle
      # `.ic` éclaircissait le pictogramme (juste sur fond sombre, BLANC SUR BLANC
      # en mode jour — 286 pictogrammes purement invisibles), et 415 autres
      # n'étaient pas dans la règle du tout, donc en couleur. Une règle qui existe
      # mais que rien ne vérifie se perd, un écran à la fois.
      - name: Contrôle de syntaxe
        shell: bash
        run: |
          for f in src/*.js; do node --check "$f"; done
          node tools/banc-executer-page.js
          node tools/verifier-fenetres.js
          node tools/verifier-mise-en-page.js
          node tools/banc-dossier-exports.js
          node tools/banc-brouillon-garde.js
          node tools/banc-contraste-jour.js
          node tools/banc-pictogrammes.js
          node tools/banc-jetons.js
          node tools/banc-fonds-jour.js
          node tools/banc-texte-sur-fond.js
          node tools/banc-accent-grave-socle.js

      - name: Construire (${{ matrix.arch }})
        shell: bash
        # Même parade que « Dépendances » : electron-builder retélécharge le zip
        # d'Electron par arch depuis la même CDN GitHub, sujette aux 503/EOF.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npx electron-builder --win --${{ matrix.arch }} --publish never; then echo "Build OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Build : échec (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Build : 5 tentatives échouées"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          # ⚠ 1 JOUR, PAS 90 (le défaut). Ces artéfacts ne sont qu'un RELAIS :
          # le workflow « Publier » du dépôt privé les récupère dans la foulée
          # et dépose tout dans R2. Or le stockage d'artéfacts GitHub n'est PAS
          # gratuit — 0,5 Go inclus, à l'échelle du COMPTE, dépôt public ou non —
          # et un seul build (~1,6 Go) le dépasse déjà. Sans rétention courte,
          # 90 jours de builds s'accumulent et la facture de stockage tombe.
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  macos:
    needs: menage
    # ⚠ DÉSACTIVÉ PAR DÉFAUT, ET C'EST VOULU. Aucun Mac n'est en service, et la
    # mise à jour automatique y est de toute façon impossible tant que
    # l'application n'est pas signée par Apple (99 $US/an) : ces paquets ne
    # serviraient à personne. Cochez la case le jour où un Mac arrive.
    if: inputs.avec_mac
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Injecter la clé d'application
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js
      - name: Dépendances
        run: npm ci || npm install
      - name: Construire (${{ matrix.arch }})
        # Sans CSC_IDENTITY_AUTO_DISCOVERY=false, electron-builder cherche un
        # certificat Apple sur l'exécuteur et échoue.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          # Même raison que le côté Windows : relais vers R2, rétention courte.
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  recapitulatif:
    needs: [windows, macos]
    if: always() && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Quoi faire ensuite
        run: |
          echo "## Construction ${{ inputs.version }} terminée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les paquets sont en artéfacts de **cette exécution** (\`${{ github.run_id }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour les publier : dépôt privé **Sandriza** → Actions → " >> $GITHUB_STEP_SUMMARY
          echo "**Publier l'application de bureau** → \`run_id = ${{ github.run_id }}\`, \`version = ${{ inputs.version }}\`." >> $GITHUB_STEP_SUMMARY
