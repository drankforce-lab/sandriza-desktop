# =============================================================================
# CONSTRUCTION DE L'APPLICATION DE BUREAU — dépôt PUBLIC
# -----------------------------------------------------------------------------
# ⚠ CE WORKFLOW NE PUBLIE RIEN. Il construit, et dépose les paquets en
# ARTÉFACTS de l'exécution. La publication dans Cloudflare R2 se fait depuis le
# dépôt PRIVÉ (workflow « Publier l'application de bureau »), qui seul détient
# les identifiants R2.
#
# ── POURQUOI CETTE SÉPARATION ────────────────────────────────────────────────
# Les minutes GitHub Actions sont GRATUITES et illimitées sur un dépôt public,
# alors qu'un dépôt privé les décompte — et les minutes macOS y comptent ×10.
# Construire ici ne coûte rien.
# Mais le bucket R2 ne contient pas que des installateurs : il porte aussi les
# SAUVEGARDES, les PHOTOS PRODUIT et les EXPORTS COMPTABLES. Ses identifiants
# n'ont donc rien à faire dans un dépôt public, quelles que soient les
# protections de GitHub sur les secrets. Ils restent du côté privé.
#
# ── CE QUI EST PUBLIC ICI, ET CE QUI NE L'EST PAS ────────────────────────────
# Public : le code de la COQUILLE — une fenêtre Electron qui ouvre
#          adm.sandriza.com, imprime, et gère ses mises à jour. Aucune donnée
#          d'affaires, aucun code de la boutique, aucun accès à la base.
# Secret : `ELG_APP_KEY`, la clé du verrou d'application, écrite dans
#          `src/cle.js` À LA CONSTRUCTION et jamais commitée.
#
# ⚠ LES SECRETS NE SONT PAS EXPOSÉS AUX FORKS. GitHub ne les fournit pas aux
# exécutions déclenchées par une pull request venant d'un fork, et
# `workflow_dispatch` exige un droit d'écriture sur le dépôt. C'est pour ça que
# ce workflow n'a QUE ce déclencheur : pas de `push`, pas de `pull_request`.
# =============================================================================
name: Construire

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (doit correspondre à package.json)"
        required: true
      avec_mac:
        description: "Construire aussi les paquets macOS ? (inutile tant qu'aucun Mac n'est en service — et la mise à jour automatique y est impossible sans signature Apple)"
        type: boolean
        required: true
        default: false
      avec_themes:
        description: "Mesurer AUSSI les six thèmes de l'administration ? (relevé complet, ~15 min — nécessaire seulement pour retirer une ligne de contraste-rendu-declare.js)"
        type: boolean
        required: false
        default: false

# Aucun droit n'est nécessaire : on ne touche ni au dépôt, ni aux releases.
permissions:
  contents: read
  actions: write        # pour purger les artefacts des constructions precedentes

jobs:
  # ══ LE MENAGE PASSE AVANT, ET C'EST OBLIGATOIRE ══════════════════════════
  # Signale le 2026-09-04 par une alerte GitHub : << You have used 100% of the
  # Actions storage >>. Le quota est de 0,5 Go ; une construction depose trois
  # installateurs Windows, soit ~240 Mo. DEUX constructions suffisent donc a le
  # remplir, et il y en avait eu sept dans la journee — 1 582 Mo, trois fois le
  # quota, facturable.
  #
  # ⚠ `retention-days: 1` NE SUFFIT PAS, et c'est le piege : il etait deja pose.
  # La retention se compte en JOURS, alors que le depassement se produit en
  # QUELQUES HEURES. Un delai n'a jamais borne un debit.
  #
  # ⚠ POURQUOI ICI ET PAS APRES LA PUBLICATION : le jeton du depot du site
  # (`GH_DESKTOP_TOKEN`) est volontairement en LECTURE SEULE sur les Actions de
  # ce depot-ci — il peut telecharger les paquets, pas les effacer. Le seul
  # jeton qui a le droit de supprimer est celui de ce depot, donc le menage se
  # fait ici, AVANT de deposer les nouveaux paquets. Le stockage ne peut alors
  # plus depasser une construction.
  #
  # ⚠ CE QUE CELA IMPOSE : PUBLIER AVANT DE RECONSTRUIRE. Les paquets d'une
  # construction non publiee disparaissent au lancement de la suivante. Ce n'est
  # pas une perte — une version publiee vit dans R2, pas ici — mais l'ordre
  # build -> publish -> build est desormais la seule marche a suivre.
  menage:
    runs-on: ubuntu-latest
    steps:
      - name: Purger les artefacts des constructions precedentes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          total=0
          n=0
          for page in 1 2 3; do
            ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100&page=$page"                     --jq '.artifacts[] | select(.expired==false) | "\(.id) \(.size_in_bytes)"' || true)
            [ -z "$ids" ] && break
            while read -r id taille; do
              [ -z "$id" ] && continue
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || continue
              total=$((total + taille)); n=$((n + 1))
            done <<< "$ids"
          done
          echo "::notice::$n artefact(s) purge(s), $((total / 1048576)) Mo liberes avant construction."

  # ══ LES CONTRASTES, MESURES DANS UN VRAI NAVIGATEUR ══════════════════════
  # ⚠ POURQUOI UN TRAVAIL A PART, ET PAS DANS << Controle de syntaxe >>.
  # Ce dernier tourne sur la MATRICE des trois architectures Windows : y mettre
  # un banc de deux a quatre minutes le ferait tourner TROIS FOIS, sur trois
  # machines, pour un resultat identique — les couleurs d'une page ne dependent
  # pas du processeur qui la construit. Une seule machine Linux suffit, et elle
  # tourne EN MEME TEMPS que les constructions.
  #
  # ⚠ IL NE BLOQUE PAS LA CONSTRUCTION (`needs` ne le nomme pas). Une version
  # doit pouvoir partir meme si un contraste a glisse : refuser de construire
  # pour une couleur, c'est se retrouver a le desactiver le jour ou ca presse.
  # Le travail est ROUGE et se voit dans le recapitulatif — c'est ce qu'on veut.
  #
  # ⚠ Chrome est deja installe sur `ubuntu-latest`. S'il venait a disparaitre,
  # le banc REFUSE (il ne se tait pas) : << Chrome introuvable >>, et le travail
  # est rouge. Un banc qui saute faute d'outil doit le dire.
  contrastes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ⚠⚠ TOUS LES SCENARIOS PLUTOT QUE TOUS LES THEMES — un budget, un choix.
      # La 4.40.0 faisait tourner `--themes` (1 104 affichages, ~6 min). La
      # 4.41.0 a decouvert bien pire : le banc ne mesurait que le PREMIER
      # scenario de chaque fenetre, soit 92 des 339 declares. Les trois quarts
      # des ecrans n'etaient jamais regardes.
      # Croiser les deux ferait ~1 600 affichages et un quart d'heure. Entre les
      # deux, le choix n'est pas serre : un THEME ne deplace que des fonds (les
      # 118 << fautes de themes >> se ramenaient a 8 endroits), tandis qu'un
      # SCENARIO montre un contenu different — une fiche produit, un onglet, une
      # vue en lecture seule. On garde donc les 339 scenarios en 2 modes, et les
      # six themes restent a la main (`--themes`).
      # ⚠ Ce choix est ecrit ici parce qu'il se defend, pas parce qu'il va de soi.
      # ⚠⚠ `avec_themes` — AJOUTE LE 2026-09-14 (#108), ET VOICI POURQUOI.
      # Le banc annonce les lignes de `contraste-rendu-declare.js` qui ne sont
      # << plus rencontrees NULLE PART dans un releve COMPLET >> et propose de
      # les retirer. Or ce passage-ci ne peint AUCUN des six themes — il le dit
      # lui-meme, les themes sont son angle mort n. 5. Une paire eteinte en
      # jour/nuit peut etre la seule chose qui garde un texte lisible en
      # `ardoise` : la retirer ne se voit pas le jour meme, et revient en rouge
      # une construction plus tard, sur un chantier sans rapport.
      # ➡ Le banc REFUSE desormais de conclure sans `--themes`. Cette entree
      # permet de lui donner le releve complet quand on veut retirer une ligne,
      # sans imposer le quart d'heure a chaque construction.
      - name: Contrastes des fenetres, mesures au rendu (339 scenarios x 2 modes)
        env:
          SZ_CONTRASTE_BUDGET_MS: '1500000'
        # ⚠⚠ UNE SEULE LIGNE, ET CE N'EST PAS UN DETAIL DE STYLE. `tools/bancs.js`
        # lit la liste des bancs DANS CE FICHIER, avec le motif `^\s*node tools/`.
        # Ecrite en bloc `run: |`, la commande commence la ligne — et ce banc-ci,
        # qui ouvre Chrome des dizaines de fois, se retrouvait dans la rafale
        # LOCALE. C'est exactement ce qui a fait tomber l'affichage de son poste
        # deux fois le 2026-09-05. Sur `run:` d'une ligne, le motif ne mord pas.
        # (Fait et defait le 2026-09-14 : le compte est passe de 39 a 40 bancs,
        # et c'est ce chiffre qui l'a trahi.)
        run: node tools/banc-contraste-rendu.js ${{ inputs.avec_themes && '--themes' || '' }}

  windows:
    needs: menage
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── La clé du verrou, injectée ICI et nulle part ailleurs ──────────────
      # ⚠ On ÉCHOUE si le secret est absent. Sans lui, l'application se
      # construirait très bien — et serait refusée (403) par le serveur sur
      # chaque poste. Mieux vaut ne rien livrer qu'un paquet mort-né.
      - name: Injecter la clé d'application
        shell: bash
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent. L'application construite serait refusée par le serveur."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js

      # ⚠⚠ ET LE PALIER : LA MINEURE NE DÉPASSE PAS 75. Règle posée le 2026-08-09
      # — arrivé à `x.75.0`, la suivante est `(x+1).0.0`, jamais `x.76.0`. Sans
      # palier, la mineure grossit indéfiniment et le numéro ne dit plus rien de
      # l'ampleur du travail.
      # Elle était notée, indexée, et elle a été enfreinte DEUX FOIS quand même :
      # `2.76.0`, puis `3.76.0` (corrigée en 4.0.0). Une règle qu'on répète et
      # qu'on oublie n'est pas une règle, c'est un vœu — donc c'est un contrôle,
      # et il vit ICI parce que c'est la construction qui transforme un numéro en
      # version installée chez quelqu'un. Le pendant côté site est l'étape 1k de
      # `tools/check/verifier.ps1`, qui lit les clés de NOTES dans `pont.js`.
      - name: Vérifier la version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::package.json annonce $PKG, la demande porte sur ${{ inputs.version }}."
            exit 1
          fi
          MAJ=${PKG%%.*}
          RESTE=${PKG#*.}
          MIN=${RESTE%%.*}
          if [ "$MIN" -gt 75 ]; then
            echo "::error::Palier de version enfreint : $PKG a une mineure de $MIN. Arrivé à $MAJ.75.0, la suivante est $((MAJ+1)).0.0 — jamais $MAJ.76.0."
            exit 1
          fi
          if [ "$MIN" -eq 75 ]; then
            echo "::warning::$PKG atteint le plafond : la PROCHAINE version doit être $((MAJ+1)).0.0."
          fi

      - name: Dépendances
        shell: bash
        # ⚠ Le binaire Electron se télécharge (install.js) depuis la CDN des
        # « releases » de GitHub, régulièrement en panne TRANSITOIRE : EOF, 503,
        # socket hang up — TROIS échecs d'affilée le 2026-08-12, pur réseau, pas
        # le code. On réessaie depuis LA MÊME source officielle (github.com/
        # electron), aucun miroir tiers — le binaire reste celui d'Electron —,
        # avec un délai croissant. `npm ci` repart d'un node_modules propre.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npm ci || npm install; then echo "Dépendances OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Dépendances : échec réseau (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Dépendances : 5 tentatives échouées (CDN Electron indisponible ?)"; exit 1; fi

      # Un simple contrôle de syntaxe : une faute de frappe ici coûte une
      # construction complète et une réinstallation sur chaque poste.
      # ⚠ `src/*.js` NE COUVRAIT PAS `src/fenetres/`, où vit tout le contenu des
      # fenêtres natives — c'est-à-dire l'essentiel de ce qui change d'une version
      # à l'autre. Et `node --check` n'y aurait de toute façon pas suffi : le
      # script de chaque fenêtre vit dans un littéral de gabarit, donc pour Node
      # c'est une CHAÎNE, et une faute dedans passe inaperçue. La fenêtre s'ouvre,
      # reste sur « Chargement… », et rien n'explique pourquoi.
      # `verifier-fenetres.js` compile le script PRODUIT, refuse l'accent grave
      # égaré dans un commentaire (arrivé quatre fois) et vérifie les ancres du
      # socle. C'est le contrôle qui a de la valeur ici, pas le plus rapide.
      # ⚠ ET COMPILER NE SUFFISAIT PAS NON PLUS. La fenêtre Imprimantes est restée
      # morte QUATRE VERSIONS avec un script qui compilait parfaitement : la faute
      # était une variable libre, licite à la compilation, fatale à l'exécution.
      # `verifier-fenetres.js` EXÉCUTE donc maintenant chaque fenêtre sur des
      # données d'essai. Et `banc-executer-page.js` éprouve L'OUTIL lui-même en y
      # injectant des défauts connus — parce que ce même outil a été construit deux
      # fois de travers, et qu'il annonçait alors « aucune faute » sur du code qui
      # levait vraiment. Il passe d'abord : un contrôle aveugle vaut moins que rien,
      # il rassure.
      # ⚠ ET AUCUN DE CES CONTRÔLES NE REGARDE CE QUE LA FENÊTRE DONNE À VOIR.
      # `executer-page.js` le dit lui-même : « ce n'est pas un navigateur [...] ce
      # contrôle ne dit donc pas la fenêtre est belle ». Il prouve qu'elle ne meurt
      # pas en silence. `verifier-mise-en-page.js` (2026-08-21) ajoute les trois
      # défauts de mise en page qui ne lèvent RIEN : une étiquette dont le for=
      # pointe vers un identifiant inexistant (le clic ne fait rien, et le lecteur
      # d'écran annonce un champ sans nom), une zone de texte où PERSONNE n'a choisi
      # de hauteur (le navigateur en met deux lignes), et une fenêtre
      # redimensionnable sans minHeight (ses boutons du bas sortent de l'écran).
      # ⚠⚠ QUATRIÈME DÉFAUT depuis le 2026-09-08 : un <select> que RIEN n'annonce.
      # La première section demande « cette étiquette pointe-t-elle vers un
      # champ ? » — elle ne demandait JAMAIS l'inverse, « ce champ a-t-il une
      # étiquette ? », et 40 listes déroulantes étaient muettes au lecteur
      # d'écran. C'est un CLIQUET : le reste toléré est nommé un par un, avec sa
      # raison, dans `champs-sans-nom-declares.js` — un nouveau select sans nom
      # fait échouer la construction.
      # ⚠ Il ne juge QUE les <select>, délibérément : un input garde souvent son
      # placeholder, et élargir maintenant rendrait 178 étiquettes voisines non
      # reliées plus 91 placeholders — un contrôle que personne ne lirait.
      # ⚠ Il ne MESURE rien — il lit le texte. Il attrape ce qui est décidable sans
      # dessiner, et se TAIT dès qu'une valeur est calculée ou qu'un rows= est écrit
      # à la main : un rows= explicite est une décision, pas un oubli.
      # ⚠ `banc-dossier-exports.js` (2026-08-22) garde une règle qu'aucun des
      # contrôles ci-dessus ne peut voir : quand le dossier des exports choisi ne
      # répond plus (clé retirée, lecteur réseau tombé), l'export doit RÉUSSIR
      # quand même, le repli doit être ANNONCÉ, et le choix doit être GARDÉ. Rien
      # là-dedans ne lève d'erreur si c'est faux — l'export réussirait en silence
      # au mauvais endroit. La règle a été SORTIE de `main.js` pour ça : `main.js`
      # exige le processus principal d'Electron, donc un banc ne peut que le
      # recopier, et une copie ne garde rien.
      # ⚠ `banc-brouillon-garde.js` (2026-08-22) garde le même genre de règle,
      # et elle a DEUX façons de mal tourner dont la seconde est pire que la
      # première : trop permissive, la fenêtre part avec la saisie ; trop
      # stricte, l'application ne se ferme PLUS et l'on finit par la tuer depuis
      # le gestionnaire des tâches — le geste le plus destructeur de tous. Elle
      # est sortie de `main.js` pour la même raison que le dossier des exports.
      # ⚠ `banc-contraste-jour.js` (2026-09-04) garde la LISIBILITÉ DU MODE JOUR,
      # et c'est le dernier angle mort de cette liste : aucun contrôle ci-dessus ne
      # regarde une couleur. Le dépôt du site a bien un banc de contraste, mais il
      # vit là-bas et ne voit pas les fenêtres natives. C'est ainsi qu'une dette de
      # 2 300 déclarations s'est accumulée — des couleurs de mode SOMBRE posées sur
      # le fond CLAIR du mode jour, #8fa1b8 sur 828 endroits à 2.36 de ratio, et pas
      # un seul rouge pour le dire. Il a fallu deux captures d'écran de
      # l'utilisateur : « en mode jour regarde ce n'est pas beau ».
      # ⚠ C'est un CLIQUET, pas une porte fermée : la queue restante est déclarée
      # avec son nombre dans `contraste-jour-declare.js`, et le banc refuse une
      # couleur neuve sous le seuil ou un plafond qui monte.
      # ⚠⚠ `banc-couture-cadre.js` (2026-09-12) garde LA COUTURE DU CADRE. La
      # fenêtre principale joue deux rôles — LE SITE (le pont, les 429 cœurs) et
      # LE CADRE (la zone où les écrans s'ancrent). La tranche suivante fait
      # passer le site dans une vue CACHÉE : ce jour-là, tout appel écrit en
      # dehors de `siteWC()` / `cadreWC()` sera faux, et personne ne le verra —
      # `send('dock:ancree')` et `send('usb:photos')` s'écrivent exactement
      # pareil. Ce n'est PAS un compteur de dette : les autres usages de
      # `mainWindow.webContents` (zoom, thème, gardes) sont légitimes et le
      # restent. Le banc a été éprouvé dans les DEUX SENS.
      # ⚠⚠ `banc-accents-visibles.js` (2026-09-12) LIT LE TEXTE AFFICHÉ et refuse
      # du français SANS SES ACCENTS. Le 2026-09-11, `promo-editeur.js` est parti
      # en production avec tout son texte visible en « Modele », « Opacite »,
      # « Apercu », et y est resté une journée : le défaut a été trouvé en rouvrant
      # le fichier pour autre chose, c'est-à-dire par chance. AUCUN banc ne
      # pouvait le voir — celui des contrastes lit des COULEURS, `banc-francais`
      # cherche le mot « cliente », `verifier-fenetres` vérifie qu'une fenêtre
      # DESSINE, pas ce qu'elle écrit.
      # ⚠ LA CAUSE EST TOUJOURS LÀ : l'en-tête de chaque fenêtre dit « aucun accent
      # grave », qui désigne le CARACTÈRE ` refermant le gabarit — pas les lettres
      # accentuées. La confusion a déjà été faite deux fois. D'où un banc plutôt
      # qu'une consigne de plus.
      # ⚠ IL A FALLU LE RENDRE PRÉCIS AVANT DE LE RENDRE UTILE : 1596 accusations
      # au premier jet, 152 au deuxième, 7 au bout — toutes vraies. Un banc à un
      # taux de faux comme les premiers ne se corrige pas, il se désactive.
      # Éprouvé dans les DEUX SENS : 12 accusations sur le `promo-editeur.js` de
      # 5644178 (la version fautive, reprise de l'historique), zéro sur l'actuel.
      # ⚠⚠ `banc-filtre-pas-releve.js` (2026-09-12) garde TROIS CONCLUSIONS que le
      # banc de contraste au rendu n'a pas le droit de tirer sous `SZ_CONTRASTE_FENETRE`
      # — le réglage qui restreint le parcours à UNE fenêtre. Sous filtre, une clé
      # « plus rencontrée » est une clé NON CHERCHÉE : il annonçait « DETTE ÉTEINTE »
      # et proposait de retirer 63 lignes mesurées ailleurs, preuve à l'appui. Une
      # ligne retirée ainsi ne revient pas toute seule : elle gardait une couleur,
      # et plus rien ne la garde.
      # ⚠ LE CLIQUET RESTE DEBOUT DANS L'AUTRE SENS, et le banc l'exige : une dette
      # qui MONTE sous filtre a vraiment monté. Faire taire le cliquet des deux
      # côtés est la correction la plus simple, et la plus fausse.
      # ⚠ C'est un contrôle de SOURCE, pas un essai : `banc-contraste-rendu.js` ouvre
      # Chrome des dizaines de fois et ne tourne QUE dans le travail `contrastes`.
      # Un garde qui exigerait un rendu ne serait jamais joué au moment où l'on
      # modifie le fichier. Éprouvé par DEUX pannes provoquées.
      # ⚠ `banc-accent-grave.js` (2026-09-04, ÉLARGI le 2026-09-08) refuse un
      # accent grave a l'interieur d'un gabarit de fenetre. Trois fois dans la
      # meme journee, un nom de code entre accents graves dans un commentaire CSS
      # a referme le gabarit et fait tomber les 92 fenetres. `node --check` repond
      # OK dessus des que le nombre d'accents graves reste PAIR : un gabarit
      # referme trop tot reste syntaxiquement valide, et la portion de page part
      # en silence. Ce banc nomme la ligne en deux dixiemes de seconde.
      # ⚠⚠ IL NE LISAIT QUE `socle.js`, ET LA MEME FAUTE EST REVENUE LE
      # 2026-09-08 DANS `journaux.js` — que rien ne regardait. Il lit maintenant
      # les 94 fenetres et les DEUX formes d'ouverture (`const NOM = ` et
      # `return `). 204 gabarits, zero faux positif a la livraison.
      # ⚠ `banc-texte-sur-fond.js` (2026-09-04) mesure le texte contre le fond de
      # SON PROPRE ELEMENT, pas contre celui de la page. C'est ce qui manquait :
      # un vert clair sur une pastille vert pale donne 1.02 de ratio, invisible,
      # alors que le meme vert sur le creme de la page passe le seuil. 40 regles
      # etaient en defaut, dont 25 sous 1.5. La cause de fond : les jetons de la
      # charte (--sz-accent et les six themes) n'avaient aucune valeur de jour.
      # ⚠ `banc-fonds-jour.js` (2026-09-04) est la moitié manquante du banc de
      # contraste, qui ne regarde QUE le texte et le dit dans son en-tête. Onze
      # vraies surfaces — fil des étapes des fiches, corps de facture, bande de
      # lot, panneau de l'assistant photos — restaient noires quand la fenêtre
      # passait en clair. Un fond sombre doit avoir sa reprise `html.jour`, ou
      # être déclaré comme accent plein dont la couleur porte un sens.
      # ⚠ `banc-jetons.js` (2026-09-04) garde les JETONS DE COULEUR. Il a fallu
      # trois corrections ratées et un navigateur pour trouver la cause du
      # bandeau d'en-tête invisible en mode sombre : le bloc `:root` des jetons
      # de NUIT vivait dans `CSS_SOCLE`, que 4 fenêtres sur 92 incluent. Les 88
      # autres n'avaient AUCUN jeton en sombre — chaque `var()` y était une
      # valeur invalide. `color-scheme:dark` donnait quand même un fond sombre,
      # ce qui a masqué le défaut pendant des jours. Ce banc FABRIQUE chaque
      # fenêtre et exige que tout `var()` employé soit défini par sa page.
      # ⚠ `banc-pictogrammes.js` (2026-09-04) garde la norme du NOIR ET BLANC,
      # posée le 2026-08-19 et que rien ne vérifiait. Deux défauts en sont sortis,
      # tous deux signalés par l'utilisateur plutôt que par une machine : la règle
      # `.ic` éclaircissait le pictogramme (juste sur fond sombre, BLANC SUR BLANC
      # en mode jour — 286 pictogrammes purement invisibles), et 415 autres
      # n'étaient pas dans la règle du tout, donc en couleur. Une règle qui existe
      # mais que rien ne vérifie se perd, un écran à la fois.
      - name: Contrôle de syntaxe
        shell: bash
        run: |
          # ══ CE FICHIER-CI SE LIT-IL ENCORE ? ════════════════════════════════
          # ⚠⚠⚠ IL EST PASSE EN PREMIER PARCE QUE S IL EST INVALIDE, RIEN DE CE
          # QUI SUIT NE TOURNE. Dans un litteral de bloc YAML, une ligne MOINS
          # indentee que le contenu TERMINE le bloc : un commentaire pose a
          # 6 espaces au milieu de commandes indentees a 10 coupe le script en
          # deux, et la commande suivante devient une cle YAML invalide.
          # ⚠ GitHub cree alors une execution EN ECHEC a CHAQUE PUSH, en « 0s »,
          # avec pour seule explication « This run likely failed because of a
          # workflow file issue ». Rien ne le voyait ici : tous les bancs lisent
          # du JavaScript, et `tools/bancs.js` tirait quand meme la bonne liste
          # de ce fichier — tout paraissait normal. DOUZE pushes verts en local,
          # douze courriels d echec, et c est LUI qui a demande si c etait normal.
          # ⚠⚠ LA LECON : un fichier qu on ECRIT ici mais qu on n EXECUTE que
          # la-bas n a aucun garde par defaut. `build.yml` decrit tous les
          # controles du depot — il n en avait aucun sur lui-meme.
          # ⚠ Et le commentaire reste le bienvenu : il doit etre DANS le bloc,
          # ou `#` est un commentaire de SHELL. Comme celui-ci.
          node tools/banc-workflow-yaml.js
          for f in src/*.js; do node --check "$f"; done
          node tools/banc-executer-page.js
          node tools/verifier-fenetres.js
          # ⚠ `verifier-fenetres` EXÉCUTE le chargement, jamais un clic : un
          # gestionnaire de bouton qui appelle une fonction inexistante lui échappe.
          # C'est arrivé le 2026-09-09 (« quand je clique sur activer rien ne se
          # passe »). Celui-ci lit la source et exige que tout appel nu vise une
          # fonction qui existe.
          node tools/verifier-appels-fenetres.js
          # ⚠ ET CELUI-CI GARDE L AUTRE MOITIE : les appels de MEMBRE vers le
          # prechargement (`P.majDecision(...)`, `P.fermer()`). `verifier-appels`
          # ne resout que les noms nus, DANS la fenetre ; ces verbes-la vivent
          # dans src/pont-preload.js. Provoque le 2026-09-10 : en retirant un
          # verbe du prechargement, les QUINZE bancs repondaient << tout passe >>,
          # et le symptome reel etait un bouton << Installer maintenant >> inerte.
          node tools/verifier-verbes-pont.js
          node tools/verifier-mise-en-page.js
          node tools/banc-dossier-exports.js
          node tools/banc-brouillon-garde.js
          # ⚠⚠ ET CELUI-CI GARDE UNE BOÎTE QUI NE SE DESSINE PAS SANS RIEN CASSER.
          # `szBrouillonProposer` sort par `return false` quand la réponse n'a pas
          # de brouillon : aucune erreur, aucune trace, un écran normal. Dix-huit
          # fenêtres branchent ce mécanisme et, le 2026-09-13, sa boîte n'était
          # dessinée que dans UNE — les dix-sept autres passaient au vert.
          # ⚠⚠⚠ CE QUI AVAIT GELÉ LA COUVERTURE ÉTAIT UN COMMENTAIRE : le jeu
          # d'épreuve affirmait que deux fenêtres seulement étaient atteignables
          # sans simuler de clic. La mesure en compte HUIT. Une limite écrite
          # n'est pas une limite mesurée — elle donne surtout une raison de ne
          # pas chercher.
          # ⚠ Ce banc ne DÉDUIT donc rien : pour chaque fenêtre déclarée « hors
          # de portée », il rejoue tous ses cas en injectant un brouillon et
          # refuse si la boîte paraît. Une déclaration qui se vérifie toute
          # seule ne peut pas pourrir. 40 cas rejoués, en moins d'une seconde.
          node tools/banc-brouillon-reprise.js
          node tools/banc-contraste-jour.js
          node tools/banc-pictogrammes.js
          node tools/banc-jetons.js
          node tools/banc-fonds-jour.js
          node tools/banc-texte-sur-fond.js
          # ⚠ `tools/bancs.js` (2026-09-08) lance TOUS ces bancs d'un coup, en
          # LISANT leur liste dans CE fichier — à faire avant chaque push. Il est
          # né d'un échec de construction sur `banc-pictogrammes.js` : le banc
          # était vert plus tôt dans la séance, le fichier a changé après, et
          # seul un SOUS-ENSEMBLE de bancs avait été rejoué à la main. Choisir
          # soi-même quels contrôles rejouer, c'est décider sans savoir quels
          # défauts on vient d'introduire.
          # ⚠ Ne PAS y recopier la liste : il la lit ici. Un banc ajouté au CI et
          # oublié là-bas donnerait un vert local suivi d'un rouge distant.
          node tools/banc-accent-grave.js
          node tools/banc-couture-cadre.js
          node tools/banc-accents-visibles.js
          # ⚠⚠⚠ `banc-langue-donnees.js` (2026-09-12) GARDE LA CONSIGNE LA PLUS
          # IMPORTANTE DU CHANTIER BILINGUE, dite par lui mot pour mot : « la traduction
          # doit affecter que la lecture et non pas les données enregistrées — autrement
          # dit une donnée écrite en français ne doit pas être altérée. »
          # ⚠ CETTE FAUTE-LÀ EST SILENCIEUSE ET DIFFÉRÉE : rien ne casse au moment où on
          # la commet. Elle se découvre des semaines plus tard, quand une fiche ne répond
          # plus à son nom ou qu'un filtre ne trouve plus rien — et la donnée fausse est
          # DÉJÀ enregistrée. On ne la retrouve pas en relisant le code : il faudrait
          # relire la base. D'où un banc, et pas une consigne de plus.
          # Il refuse qu'une chaîne atteignant un chemin d'écriture ait une entrée de
          # dictionnaire : valeur d'option, champ pré-rempli, argument d'une opération
          # d'écriture. On traduit le LIBELLÉ, jamais la VALEUR.
          # ⚠ Sa première version annonçait 504 chaînes protégées dont PAS UNE n'en était :
          # elle ramassait des morceaux de concaténation (`value="' + esc(v) + '"`). Vert
          # parce qu'il regardait à côté — éprouvé depuis par une panne provoquée.
          node tools/banc-filtre-pas-releve.js
          node tools/banc-langue-donnees.js
          # ⚠⚠ CELUI-CI ATTRAPE UNE FAUTE QUE QUATRE GARDES VERTS LAISSENT PASSER :
          # un `${T("…")}` posé non pas sur une phrase mais sur du CODE, comme
          # `new ${T("Date")}()`. Tant que la traduction rend le même mot, la page
          # française ET la page anglaise sont justes — comparaison octet pour octet,
          # `node --check`, compteur et coup d'œil à la page passent tous. La faute
          # n'attend qu'une chose : que quelqu'un traduise ce mot autrement, et la
          # fenêtre meurt DANS UNE SEULE LANGUE, celle que personne ne relit.
          # ⚠ Ce n'est pas une crainte : DEUX fenêtres déclarées terminées le
          # portaient déjà (depenses:820, ramassages:140), après relecture à la main.
          # Éprouvé par quatre pannes provoquées, une par signature.
          node tools/banc-langue-sur-code.js
          # ⚠⚠ ET CELUI-CI DESSINE LA PAGE **ANGLAISE** ET Y CHERCHE DU FRANÇAIS —
          # une question que le compteur ne pose pas. `chainesProse` écarte à dessein
          # les chaînes d'UN SEUL MOT (pour ne pas prendre un identifiant pour une
          # phrase) : un mot français collé à un nombre — « 3 unité », « 12 étiquette »
          # — traverse donc le compteur sans un bruit et s'affiche tel quel en anglais.
          # Sur la page anglaise, un mot accentué n'a aucune raison d'être là :
          # l'accent devient une signature, pas une ressemblance.
          # ⚠ Ce contrôle avait été refait À LA MAIN trois séances de suite, et il
          # trouvait quelque chose à chaque fois. Au premier passage : 34 textes
          # français dans 7 fenêtres déclarées TERMINÉES.
          node tools/banc-langue-residuel.js
          # ⚠⚠ ET CELUI-CI GARDE CE QU'AUCUN DICTIONNAIRE NE PEUT ATTEINDRE, parce
          # que CE NE SONT PAS DES TEXTES : l'attribut `lang` de la page, le lieu
          # passé à `toLocaleString`, la virgule décimale posée à la main. Les 98
          # fenêtres ont été traduites 7 847 fois, les DEUX mesures sont à zéro —
          # et les 98 écrivaient encore `<html lang="fr">` en dur. Un défaut qui
          # vit hors du champ des deux mesures n'est signalé par rien.
          # ⚠ Ce que ça coûte, puisque « l'anglais s'affiche quand même » : le
          # navigateur coupe les mots à la française, le correcteur souligne tout
          # l'anglais, le lecteur d'écran l'ÉPELLE avec un accent français — et
          # `.replace('.', ',')` fait lire un nombre FAUX (1,234 se lit
          # mille-deux-cent-trente-quatre en anglais).
          # ⚠ Ses trois exceptions portent chacune leur raison, et celle de
          # `connexion.js` est une CONDITION que le banc vérifie vraiment.
          # Éprouvé par une panne provoquée, une par motif.
          node tools/banc-langue-page.js
          # ⚠⚠⚠ ET CELUI-CI EST LA MESURE QUI NE PEUT PAS MENTIR — il existe parce
          # que j'ai fait TAIRE une mesure sans rien traduire (2026-09-13). Après
          # son signalement, 113 entrées de dictionnaire ajoutées : le compteur est
          # passé à ZÉRO, et la page anglaise était TOUJOURS EN FRANÇAIS.
          # ⚠ UNE ENTRÉE DE DICTIONNAIRE NE TRADUIT RIEN SI LA SOURCE N'APPELLE PAS
          # T(). Le compteur demande « une décision existe-t-elle ? » ; celui-ci
          # dessine la page ANGLAISE et refuse tout texte visible qui est encore
          # une clé française. Ajouter une entrée de plus ne le fait pas taire :
          # seul l'enveloppement retire le texte de la page.
          # ⚠ Premier relevé : 207 textes dans 48 fenêtres, traduction existante.
          node tools/banc-langue-effet.js
          # ⚠⚠ ET CE QUI N'EST PAS DU TEXTE : LES MESURES. Sa capture du
          # 2026-09-13 disait « 417 Mo » sur une page anglaise — `Mo`, `Ko`, `Go`
          # sont FRANÇAIS (l'anglais écrit MB, KB, GB), et le symbole de la
          # monnaie ne change pas seulement, il CHANGE DE CÔTÉ : « 12,50 $ »
          # devient « $12.50 ».
          # ⚠⚠⚠ AUCUN DES BANCS CI-DESSUS NE POUVAIT LE VOIR. Ils relèvent le
          # TEXTE de la page ; « 417 Mo » n'y est pas — il est FABRIQUÉ à
          # l'exécution, dans le script, à partir d'un nombre. Le chantier
          # bilingue était à zéro faute et la page annonçait quand même « Mo ».
          # ➡ CE QUI EST FABRIQUÉ À L'EXÉCUTION ÉCHAPPE AU RELEVÉ DES TEXTES.
          # ⚠ Il essaie AUSSI les quatre recettes dans les DEUX langues : sans ça
          # il ne mesurerait qu'une absence, et retirer `JS_MESURES` du socle le
          # laisserait vert avec 99 fenêtres incapables d'afficher un montant.
          node tools/banc-langue-mesures.js
          # ⚠⚠ ET LES PHRASES ENVELOPPÉES SANS ENTRÉE. Sa capture du 2026-09-13
          # montrait « COMMANDES » et « MESSAGERIE » en français au milieu de
          # « ORDERS TO PROCESS » et « ACTIVE PRODUCTS ». Le T() était là ; le
          # dictionnaire n'avait pas l'entrée, donc repli en français.
          # ⚠ AUCUN BANC NE POUVAIT LE VOIR : le résiduel ne cherche que les
          # littéraux NUS (ceux-ci sont enveloppés), et `banc-langue-effet`
          # dessine la page SANS DONNÉES — une tuile qui n'existe qu'avec onze
          # variantes en rupture ne paraît jamais devant lui.
          # ➡ UN BANC QUI DESSINE NE VOIT QUE CE QUE SES DONNÉES FONT APPARAÎTRE.
          # Celui-ci ne dessine rien : il lit les APPELS et exige l'entrée.
          node tools/banc-langue-appels.js
          # ⚠⚠⚠ ET LE TEXTE QUI ARRIVE AVEC LES DONNÉES. Sa capture du même jour :
          # « Confirmée » et « Payée » sous des en-têtes NUMBER / CUSTOMER /
          # TOTAL / STATUS. Ces mots ne sont dans AUCUN fichier de la coquille —
          # le site les compose (ORDER_STATUS) et les envoie déjà en français.
          # ➡ UN TEXTE QUI ARRIVE AVEC LES DONNÉES N'EST DANS AUCUN FICHIER DE
          # LA FENÊTRE. Aucun relevé de source ne peut le trouver.
          # ⚠ Le lexique est confronté à sa source (admin.js, pont.js) DANS LES
          # DEUX SENS, et le banc vérifie AUSSI que ce que szLibelle ne connaît
          # pas ressort mot pour mot : ces champs portent aussi des données.
          node tools/banc-langue-libelles.js
          # ⚠⚠⚠ ET LE PLURIEL FABRIQUÉ EN AJOUTANT UNE LETTRE. Sa capture du
          # 2026-09-13 : « 11 variantes to restock ». La fenêtre écrivait
          # `T("variante") + (n > 1 ? 's' : '')` — le mot passe par le
          # dictionnaire, le « s » est collé APRÈS, en dur, dans la page.
          # ➡ EN ANGLAIS LE PLURIEL N'EST PAS TOUJOURS UNE LETTRE DE PLUS
          # (« failure » → « failures », mais « photo lisible » → « readable
          # photos » déplace le mot, et « step due » → « steps due » met le
          # « s » au PREMIER mot). Les DEUX formes s'écrivent en entier.
          # ⚠ AUCUN AUTRE BANC NE POUVAIT LE VOIR : `banc-langue-appels` trouve
          # l'entrée « variante » et dit vrai ; le résiduel ne voit qu'un « s »
          # sans accent. La faute est dans la CONCATÉNATION, pas dans les mots —
          # et personne ne regardait la concaténation. 139 occurrences, 29
          # fenêtres, toutes corrigées le jour où le banc a existé.
          node tools/banc-pluriel-colle.js
          # ⚠⚠⚠ ET LE LIBELLE PASSÉ EN ARGUMENT. Sa capture du 2026-09-13,
          # fenêtre « New product » : la page entière en anglais, et au milieu
          # « Marque », « Fournisseur », « Ex : 350 ». Les DEUX bancs de langue
          # annonçaient ZÉRO sur cette fenêtre, et tous les deux disaient vrai.
          # ➡ `textes-visibles.js` ne reconnaît QUE deux signatures : collé à du
          # balisage, ou valeur d'une propriété `label:`. Or la fenêtre fabrique
          # ses champs avec ses propres fonctions — `ch('p-marque', 'Marque')` —
          # et un mot en DEUXIÈME ARGUMENT n'a aucune des deux. Il s'affiche
          # quand même : c'est la fonction qui le pose dans le <label>.
          # ⚠ SIXIÈME FOIS QUE LE DÉFAUT EST EXACTEMENT LÀ OÙ AUCUN BANC NE
          # REGARDE. La réponse est la même qu'aux cinq précédentes : élargir le
          # terrain, pas mieux relire. Ce banc suit le texte jusqu'à la FONCTION
          # qui l'écrit. 20 libellés, 12 fenêtres, dont le bouton de `retour.js`
          # qui disait « Rembourser » — celui qui sort de l'argent.
          node tools/banc-libelle-argument.js
          # ⚠⚠⚠ ET L'ATTRIBUT COUPÉ PAR UNE CONCATÉNATION. Sa capture du
          # 2026-09-13, fenêtre « Orders » : tout en anglais — titre, colonnes,
          # jetons, bouton — et le champ de recherche qui dit « Numéro de
          # commande, nom, courriel… ». Le relevé cherche
          # `placeholder\s*=\s*"([^"<>]+)"`, une expression qui ne peut pas
          # franchir une concaténation. Or la source OUVRE l'attribut sur une
          # ligne et le FERME deux lignes plus bas, la valeur étant fabriquée
          # entre les deux. Le relevé ne voyait donc aucun attribut du tout :
          # ni complet, ni incomplet — RIEN. Et un rien ne se signale pas.
          # ⚠ La moitié de cette valeur était traduite, juste à côté : quelqu'un
          # a bien lu cette ligne, a traduit ce qui ressemblait à du texte, et a
          # laissé ce qui ressemblait à un attribut.
          node tools/banc-attribut-coupe.js
          # ⚠⚠⚠ ET LES PERMISSIONS, QUI VIVENT À TROIS ENDROITS. Le modèle
          # (`PERMISSION_DEFS`, staff.js) dit quels droits existent ; le masquage
          # (`perm:`, appbar.js) décide si une entrée de menu paraît ; la garde
          # (`_hp(…)`, admin.js) REFUSE — et c'est la seule des trois qui
          # protège. Les trois peuvent diverger en silence, dans les deux sens :
          #   · un jeton masqué absent du modèle → `permOk()` répond « inconnu,
          #     donc autorisé » : l'entrée paraît POUR TOUT LE MONDE ;
          #   · un jeton gardé absent du modèle → personne ne peut l'obtenir,
          #     donc l'écran refuse TOUJOURS, même au bon rôle.
          # ⚠ Né du découpage de `config` (2026-09-13, #103) : un seul droit
          # ouvrait 28 entrées de menu — les clés de paiement et la base de
          # données au même rang que le pied de page. Le découper voulait dire
          # toucher 71 gardes et 28 entrées ; sans mesure, une seule oubliée
          # aurait laissé une porte ouverte sans que rien ne le dise.
          # ⚠ Il exige aussi que CHAQUE module porte sa `desc` : une case qu'on
          # coche sans savoir ce qu'elle ouvre est la façon la plus ordinaire
          # d'accorder trop.
          node tools/banc-permissions.js
          # ⚠⚠ UNE ENTRÉE À PLUSIEURS DROITS OUVRE-T-ELLE UNE FENÊTRE VIVANTE ?
          # Né le 2026-09-14 (#106b) d'une faute commise le jour même : l'entrée
          # « Journaux » est passée à `perm: ['staff','newsletter']` pour rendre
          # au marketing SON journal d'envoi — et la fenêtre était MORTE pour
          # lui. Son `charger()` appelle `journal:donnees`, gardé par la lecture
          # de sécurité ; le refus sortait SANS appeler `rendre()`, donc sans
          # `tabs()` : une fenêtre vide, pas même un onglet.
          # ⚠ Rien ne le voyait : `banc-permissions` compare les trois listes, et
          # elles s'accordaient — `staff` et `newsletter` existent tous les deux.
          # Les bancs de rendu ouvrent tout en super-administrateur, pour qui
          # aucun cœur ne refuse. La faute n'était ni dans le menu ni dans la
          # fenêtre, mais dans L'ÉCART ENTRE LES DEUX.
          # ⚠ Une entrée ABSENTE se remarque ; une entrée qui OUVRE LE VIDE se
          # prend pour une panne, et on la cherche ailleurs.
          node tools/banc-entree-morte.js
          # ⚠⚠ CE QUI PARLE SANS ETRE UNE FENETRE (#99, 2026-09-14).
          # Presque tous les bancs de langue, de contraste et de rendu lisent
          # `src/fenetres/` — la ou vivent 98 ecrans sur 99. Tombe donc dehors
          # tout ce qui parle a quelqu un SANS etre une page : une boite de
          # dialogue, une notification, un menu, une infobulle. Aucun rendu ne
          # peut les relire, et un verdict vert ne dit jamais ou s arrete le
          # terrain balaye — la lecon payee neuf fois le 2026-09-13.
          # ⚠ Il ne juge pas les textes : il dit QUI est charge de les mesurer,
          # exige que chaque famille soit declaree AVEC SON COMPTE (un appel
          # ajoute fait echouer, donc force la question), et VERIFIE que le banc
          # nomme lit vraiment le fichier. Une couverture affirmee et fausse est
          # pire que pas de couverture : on cesse de regarder.
          node tools/banc-surface-hors-fenetre.js
          # ⚠⚠ TOUTE VUE ANCRÉE PORTE-T-ELLE SA RECETTE ? (2026-09-14)
          # Il l'a signalé lui-même : « quand je change pour le français le
          # tableau de bord ne change pas de langue ». Le mécanisme qui fait
          # suivre la langue aux écrans DÉJÀ OUVERTS (#96) refait chaque vue
          # ancrée en appelant `a.refaire()` — et le tableau de bord était
          # enregistré SANS cette propriété. Il était donc compté « sans
          # recette » et gardait sa langue, en silence. Le journal le disait ;
          # personne ne lit le journal.
          # ⚠ Aucun banc de langue ne pouvait le voir : `tableau.js` rend très
          # bien en anglais. Ce n'est pas la page qui était en cause, c'est le
          # fait qu'on ne la REDEMANDAIT jamais. Et les bancs au rendu dessinent
          # une page NEUVE, donc déjà dans la bonne langue — le défaut n'existe
          # qu'en CHANGEANT de langue sur une page posée.
          node tools/banc-recette-ancree.js
          # ⚠⚠ ET LES ÉCRANS BÂTIS DANS LE PROCESSUS PRINCIPAL, que NI le compteur
          # NI le résiduel ne voient : ils sont dans `main.js`, qu'aucun banc ne peut
          # faire tourner sans lancer toute l'application. C'est le seul endroit de
          # la coquille où une phrase peut rester française sans que rien ne le dise.
          # ⚠ Il vérifie dans les DEUX sens (texte sans traduction, entrée qui dort)
          # et compare les `{0}` : un chiffre présent en français et absent en
          # anglais donnerait une phrase à trou.
          # ⚠⚠ ET LA PREUVE EST VENUE DEUX FOIS. Les écrans de CHARGEMENT d'abord —
          # les pires à laisser en français, puisqu'ils paraissent au démarrage,
          # pendant le téléchargement et pendant l'INSTALLATION, quand on ne peut
          # rien faire d'autre que les lire ; un oubli trouvé dès la première
          # exécution. Puis la fenêtre « À PROPOS » (2026-09-13) : le chantier
          # bilingue s'est fermé sur « 98 fenêtres sur 98 », un compte EXACT, et
          # celle-là est restée ENTIÈREMENT française — elle n'avait jamais été
          # comptée, parce qu'elle vit hors de `src/fenetres/`. Trouvée en posant
          # la garde d'un AUTRE défaut, pas par un banc.
          # ➡ Un compte exhaustif ne l'est que sur le terrain qu'il énumère — et
          # c'est pour ça que ce banc s'appelait `banc-langue-porte` et ne gardait
          # qu'une table. Sa liste `TABLES` est ce qu'il faut étendre.
          node tools/banc-langue-processus-principal.js
          node tools/banc-veilleur.js
          node tools/banc-porte-progression.js
          # ⚠ CELUI-CI GARDE UNE CHAÎNE DE QUATRE MORCEAUX que rien d'autre ne
          # relie : le recours « mot de passe oublié » ne doit apparaître qu'après
          # un premier échec (sa demande du 2026-09-11). Retirer n'importe lequel
          # des quatre laisse la fenêtre saine et tous les autres bancs verts — le
          # bouton est simplement toujours visible, ou plus jamais.
          node tools/banc-recours-oubli.js
          # ⚠ CELUI-CI GARDE UN DÉFAUT QUI NE LÈVE RIEN. Les fenêtres natives sont
          # ENGENDRÉES, et un `\d` tapé dans le générateur arrive `d` dans le fichier
          # produit : l'expression reste VALIDE, elle cherche simplement autre chose.
          # Payé quatre fois — dont une clé TOTP copiée AVEC ses espaces, sous un
          # message qui annonçait le contraire.
          node tools/banc-antislash-fondu.js
          # ⚠ CELUI-CI GARDE UN DÉFAUT INVISIBLE DANS LA LANGUE OÙ L'ON TRAVAILLE :
          # `T(cle)` rend la CLÉ quand la traduction manque, et la clé est la phrase
          # FRANÇAISE. Une clé oubliée donne donc un écran parfaitement normal en
          # français, et une phrase française au milieu de l'anglais.
          node tools/banc-langue-connexion.js
          # ⚠ ET CELUI-CI GARDE UNE TABLE QUI VIT DANS UN AUTRE DÉPÔT QUE SA SOURCE :
          # les entrées libres du menu sont déclarées dans `appbar.js` (le site), leur
          # traduction dans `MENU_EN` (la coquille). Ajouter une entrée libre laisserait
          # la table en arrière sans aucun signal — elle s'afficherait simplement en
          # français au milieu d'un menu anglais.
          node tools/banc-menu-langue.js
          # ⚠ CELUI-CI GARDE UN DÉFAUT QUI NE SE VOIT QU'APRÈS INSTALLATION :
          # une ressource citée par src/ mais rangée hors de src/ existe en
          # développement et disparaît de l'archive. C'est ce qui a fait un carré
          # noir dans la zone de notification (2026-09-06) — et personne ne
          # pouvait le voir avant un build, une publication et une installation.
          node tools/banc-ressources-empaquetees.js
          # ⚠ CELUI-CI GARDE UNE COMMANDE QUI, SI ELLE MANQUE, NE LÈVE RIEN :
          # le bandeau de tuiles chiffrées a été recopié dans 26 fenêtres sous
          # trois noms de classe différents. La 27ᵉ sera copiée elle aussi, et
          # elle arrivera sans bouton de repli si personne ne le réclame — comme
          # « Afficher la barre latérale » a disparu sans que rien ne le dise.
          node tools/banc-tuiles-masquables.js

      - name: Construire (${{ matrix.arch }})
        shell: bash
        # Même parade que « Dépendances » : electron-builder retélécharge le zip
        # d'Electron par arch depuis la même CDN GitHub, sujette aux 503/EOF.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npx electron-builder --win --${{ matrix.arch }} --publish never; then echo "Build OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Build : échec (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Build : 5 tentatives échouées"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          # ⚠ 1 JOUR, PAS 90 (le défaut). Ces artéfacts ne sont qu'un RELAIS :
          # le workflow « Publier » du dépôt privé les récupère dans la foulée
          # et dépose tout dans R2. Or le stockage d'artéfacts GitHub n'est PAS
          # gratuit — 0,5 Go inclus, à l'échelle du COMPTE, dépôt public ou non —
          # et un seul build (~1,6 Go) le dépasse déjà. Sans rétention courte,
          # 90 jours de builds s'accumulent et la facture de stockage tombe.
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  macos:
    needs: menage
    # ⚠ DÉSACTIVÉ PAR DÉFAUT, ET C'EST VOULU. Aucun Mac n'est en service, et la
    # mise à jour automatique y est de toute façon impossible tant que
    # l'application n'est pas signée par Apple (99 $US/an) : ces paquets ne
    # serviraient à personne. Cochez la case le jour où un Mac arrive.
    if: inputs.avec_mac
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Injecter la clé d'application
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js
      - name: Dépendances
        run: npm ci || npm install
      - name: Construire (${{ matrix.arch }})
        # Sans CSC_IDENTITY_AUTO_DISCOVERY=false, electron-builder cherche un
        # certificat Apple sur l'exécuteur et échoue.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          # Même raison que le côté Windows : relais vers R2, rétention courte.
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  # ⚠⚠⚠ LE NOM DE CE TRAVAIL EST LE MESSAGE, ET C'EST DÉLIBÉRÉ (2026-09-13).
  # Il s'appelait `recapitulatif`, et son résumé disait DÉJÀ tout ce qu'il faut
  # faire ensuite — run_id et version compris. Ça n'a servi à rien : sept
  # versions ont été construites dans la même journée sans qu'aucune soit
  # publiée, et l'utilisateur les a toutes réclamées une par une en montrant un
  # écran resté sur la 5.47.0.
  # ⚠ LA CAUSE N'EST PAS L'ABSENCE DE CONSIGNE, C'EST L'ENDROIT. On lit la LISTE
  # DES TRAVAUX et leur verdict ; on n'ouvre pas le résumé d'une exécution
  # verte. « recapitulatif : success » se lit comme « c'est livré ». Le nom
  # ci-dessous ne peut pas se lire comme ça.
  # ➡ **UNE CONSIGNE RANGÉE LÀ OÙ PERSONNE NE REGARDE N'EST PAS UNE CONSIGNE.**
  # ⚠ POURQUOI PAS D'ENCHAÎNEMENT AUTOMATIQUE : publier exige les clés du bucket
  # R2, qui porte aussi les SAUVEGARDES, les PHOTOS et les EXPORTS COMPTABLES.
  # Elles ne quittent pas le dépôt privé — c'est écrit en tête du workflow
  # « Publier ». Ce dépôt-ci est public : un jeton d'écriture posé ici pour
  # déclencher l'autre serait exactement ce que ce cloisonnement évite.
  a-publier-a-la-main:
    needs: [windows, macos]
    if: always() && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Construit mais PAS publié
        run: |
          # ⚠ UNE ANNOTATION, PAS SEULEMENT UN RÉSUMÉ : elle remonte dans
          # `gh run view` et en tête de la page de l'exécution.
          echo "::notice title=PAS ENCORE PUBLIÉ::${{ inputs.version }} est construite mais N'EST PAS distribuée. Dépôt privé Sandriza → Actions → « Publier l'application de bureau » → run_id=${{ github.run_id }}, version=${{ inputs.version }}"
          echo "## ⚠ ${{ inputs.version }} est CONSTRUITE, mais PAS PUBLIÉE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tant que l'étape ci-dessous n'est pas faite, **aucun poste ne recevra cette version** :" >> $GITHUB_STEP_SUMMARY
          echo "l'application lit son flux sur \`adm.sandriza.com/update/…\`, alimenté depuis R2 par le dépôt privé." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dépôt privé **Sandriza** → Actions → **Publier l'application de bureau** →" >> $GITHUB_STEP_SUMMARY
          echo "\`run_id = ${{ github.run_id }}\`, \`version = ${{ inputs.version }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "En ligne de commande :" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run \"Publier l'application de bureau\" --repo drankforce-lab/Sandriza \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  --ref main -f run_id=${{ github.run_id }} -f version=${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
