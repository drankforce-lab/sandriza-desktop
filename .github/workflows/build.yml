# =============================================================================
# CONSTRUCTION DE L'APPLICATION DE BUREAU — dépôt PUBLIC
# -----------------------------------------------------------------------------
# ⚠ CE WORKFLOW NE PUBLIE RIEN. Il construit, et dépose les paquets en
# ARTÉFACTS de l'exécution. La publication dans Cloudflare R2 se fait depuis le
# dépôt PRIVÉ (workflow « Publier l'application de bureau »), qui seul détient
# les identifiants R2.
#
# ── POURQUOI CETTE SÉPARATION ────────────────────────────────────────────────
# Les minutes GitHub Actions sont GRATUITES et illimitées sur un dépôt public,
# alors qu'un dépôt privé les décompte — et les minutes macOS y comptent ×10.
# Construire ici ne coûte rien.
# Mais le bucket R2 ne contient pas que des installateurs : il porte aussi les
# SAUVEGARDES, les PHOTOS PRODUIT et les EXPORTS COMPTABLES. Ses identifiants
# n'ont donc rien à faire dans un dépôt public, quelles que soient les
# protections de GitHub sur les secrets. Ils restent du côté privé.
#
# ── CE QUI EST PUBLIC ICI, ET CE QUI NE L'EST PAS ────────────────────────────
# Public : le code de la COQUILLE — une fenêtre Electron qui ouvre
#          adm.sandriza.com, imprime, et gère ses mises à jour. Aucune donnée
#          d'affaires, aucun code de la boutique, aucun accès à la base.
# Secret : `ELG_APP_KEY`, la clé du verrou d'application, écrite dans
#          `src/cle.js` À LA CONSTRUCTION et jamais commitée.
#
# ⚠ LES SECRETS NE SONT PAS EXPOSÉS AUX FORKS. GitHub ne les fournit pas aux
# exécutions déclenchées par une pull request venant d'un fork, et
# `workflow_dispatch` exige un droit d'écriture sur le dépôt. C'est pour ça que
# ce workflow n'a QUE ce déclencheur : pas de `push`, pas de `pull_request`.
# =============================================================================
name: Construire

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (doit correspondre à package.json)"
        required: true
      avec_mac:
        description: "Construire aussi les paquets macOS ? (inutile tant qu'aucun Mac n'est en service — et la mise à jour automatique y est impossible sans signature Apple)"
        type: boolean
        required: true
        default: false

# Aucun droit n'est nécessaire : on ne touche ni au dépôt, ni aux releases.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ia32, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── La clé du verrou, injectée ICI et nulle part ailleurs ──────────────
      # ⚠ On ÉCHOUE si le secret est absent. Sans lui, l'application se
      # construirait très bien — et serait refusée (403) par le serveur sur
      # chaque poste. Mieux vaut ne rien livrer qu'un paquet mort-né.
      - name: Injecter la clé d'application
        shell: bash
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent. L'application construite serait refusée par le serveur."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js

      # ⚠⚠ ET LE PALIER : LA MINEURE NE DÉPASSE PAS 75. Règle posée le 2026-08-09
      # — arrivé à `x.75.0`, la suivante est `(x+1).0.0`, jamais `x.76.0`. Sans
      # palier, la mineure grossit indéfiniment et le numéro ne dit plus rien de
      # l'ampleur du travail.
      # Elle était notée, indexée, et elle a été enfreinte DEUX FOIS quand même :
      # `2.76.0`, puis `3.76.0` (corrigée en 4.0.0). Une règle qu'on répète et
      # qu'on oublie n'est pas une règle, c'est un vœu — donc c'est un contrôle,
      # et il vit ICI parce que c'est la construction qui transforme un numéro en
      # version installée chez quelqu'un. Le pendant côté site est l'étape 1k de
      # `tools/check/verifier.ps1`, qui lit les clés de NOTES dans `pont.js`.
      - name: Vérifier la version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::package.json annonce $PKG, la demande porte sur ${{ inputs.version }}."
            exit 1
          fi
          MAJ=${PKG%%.*}
          RESTE=${PKG#*.}
          MIN=${RESTE%%.*}
          if [ "$MIN" -gt 75 ]; then
            echo "::error::Palier de version enfreint : $PKG a une mineure de $MIN. Arrivé à $MAJ.75.0, la suivante est $((MAJ+1)).0.0 — jamais $MAJ.76.0."
            exit 1
          fi
          if [ "$MIN" -eq 75 ]; then
            echo "::warning::$PKG atteint le plafond : la PROCHAINE version doit être $((MAJ+1)).0.0."
          fi

      - name: Dépendances
        shell: bash
        # ⚠ Le binaire Electron se télécharge (install.js) depuis la CDN des
        # « releases » de GitHub, régulièrement en panne TRANSITOIRE : EOF, 503,
        # socket hang up — TROIS échecs d'affilée le 2026-08-12, pur réseau, pas
        # le code. On réessaie depuis LA MÊME source officielle (github.com/
        # electron), aucun miroir tiers — le binaire reste celui d'Electron —,
        # avec un délai croissant. `npm ci` repart d'un node_modules propre.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npm ci || npm install; then echo "Dépendances OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Dépendances : échec réseau (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Dépendances : 5 tentatives échouées (CDN Electron indisponible ?)"; exit 1; fi

      # Un simple contrôle de syntaxe : une faute de frappe ici coûte une
      # construction complète et une réinstallation sur chaque poste.
      # ⚠ `src/*.js` NE COUVRAIT PAS `src/fenetres/`, où vit tout le contenu des
      # fenêtres natives — c'est-à-dire l'essentiel de ce qui change d'une version
      # à l'autre. Et `node --check` n'y aurait de toute façon pas suffi : le
      # script de chaque fenêtre vit dans un littéral de gabarit, donc pour Node
      # c'est une CHAÎNE, et une faute dedans passe inaperçue. La fenêtre s'ouvre,
      # reste sur « Chargement… », et rien n'explique pourquoi.
      # `verifier-fenetres.js` compile le script PRODUIT, refuse l'accent grave
      # égaré dans un commentaire (arrivé quatre fois) et vérifie les ancres du
      # socle. C'est le contrôle qui a de la valeur ici, pas le plus rapide.
      # ⚠ ET COMPILER NE SUFFISAIT PAS NON PLUS. La fenêtre Imprimantes est restée
      # morte QUATRE VERSIONS avec un script qui compilait parfaitement : la faute
      # était une variable libre, licite à la compilation, fatale à l'exécution.
      # `verifier-fenetres.js` EXÉCUTE donc maintenant chaque fenêtre sur des
      # données d'essai. Et `banc-executer-page.js` éprouve L'OUTIL lui-même en y
      # injectant des défauts connus — parce que ce même outil a été construit deux
      # fois de travers, et qu'il annonçait alors « aucune faute » sur du code qui
      # levait vraiment. Il passe d'abord : un contrôle aveugle vaut moins que rien,
      # il rassure.
      - name: Contrôle de syntaxe
        shell: bash
        run: |
          for f in src/*.js; do node --check "$f"; done
          node tools/banc-executer-page.js
          node tools/verifier-fenetres.js

      - name: Construire (${{ matrix.arch }})
        shell: bash
        # Même parade que « Dépendances » : electron-builder retélécharge le zip
        # d'Electron par arch depuis la même CDN GitHub, sujette aux 503/EOF.
        run: |
          n=0
          until [ $n -ge 5 ]; do
            if npx electron-builder --win --${{ matrix.arch }} --publish never; then echo "Build OK (tentative $((n+1)))"; break; fi
            n=$((n+1)); echo "::warning::Build : échec (tentative $n/5) — nouvelle tentative dans $((n*30))s"; sleep $((n*30));
          done
          if [ $n -ge 5 ]; then echo "::error::Build : 5 tentatives échouées"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.arch }}
          # ⚠ 1 JOUR, PAS 90 (le défaut). Ces artéfacts ne sont qu'un RELAIS :
          # le workflow « Publier » du dépôt privé les récupère dans la foulée
          # et dépose tout dans R2. Or le stockage d'artéfacts GitHub n'est PAS
          # gratuit — 0,5 Go inclus, à l'échelle du COMPTE, dépôt public ou non —
          # et un seul build (~1,6 Go) le dépasse déjà. Sans rétention courte,
          # 90 jours de builds s'accumulent et la facture de stockage tombe.
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  macos:
    # ⚠ DÉSACTIVÉ PAR DÉFAUT, ET C'EST VOULU. Aucun Mac n'est en service, et la
    # mise à jour automatique y est de toute façon impossible tant que
    # l'application n'est pas signée par Apple (99 $US/an) : ces paquets ne
    # serviraient à personne. Cochez la case le jour où un Mac arrive.
    if: inputs.avec_mac
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Injecter la clé d'application
        env:
          ELG_APP_KEY: ${{ secrets.ELG_APP_KEY }}
        run: |
          if [ -z "${ELG_APP_KEY:-}" ]; then
            echo "::error::Le secret ELG_APP_KEY est absent."
            exit 1
          fi
          printf "module.exports = { APP_KEY: '%s' };\n" "$ELG_APP_KEY" > src/cle.js
      - name: Dépendances
        run: npm ci || npm install
      - name: Construire (${{ matrix.arch }})
        # Sans CSC_IDENTITY_AUTO_DISCOVERY=false, electron-builder cherche un
        # certificat Apple sur l'exécuteur et échoue.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          # Même raison que le côté Windows : relais vers R2, rétention courte.
          retention-days: 1
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  recapitulatif:
    needs: [windows, macos]
    if: always() && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Quoi faire ensuite
        run: |
          echo "## Construction ${{ inputs.version }} terminée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Les paquets sont en artéfacts de **cette exécution** (\`${{ github.run_id }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour les publier : dépôt privé **Sandriza** → Actions → " >> $GITHUB_STEP_SUMMARY
          echo "**Publier l'application de bureau** → \`run_id = ${{ github.run_id }}\`, \`version = ${{ inputs.version }}\`." >> $GITHUB_STEP_SUMMARY
